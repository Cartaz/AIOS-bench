[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-bench"
version = "0.1.0"
description = "Reproducible benchmark suite for local AI operating-system agents"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.9,<6.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
aios-bench = "aios_bench.cli:main"
aiosbench = "aios_bench.cli:main"

[tool.setuptools.packages.find]
include = ["aios_bench*", "core*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
