name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install project
        run: |
          chmod +x install.sh
          ./install.sh
      - name: Compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests
      - name: Ruff
        run: .venv/bin/ruff check main.py config core ui tests
      - name: Pytest
        run: .venv/bin/python -m pytest -q
