<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIOS-Bench</title>
  <link rel="stylesheet" href="app.css">
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LOCAL AGENT BENCHMARK</p>
        <h1>AIOS-Bench</h1>
      </div>
      <div id="runBadge" class="badge">Pronto</div>
    </header>

    <section class="grid">
      <aside class="panel controls">
        <div class="section-head"><h2>Configurazione</h2></div>
        <label>Suite<select id="suite"><option value="frontier_v3">Frontier v3</option><option value="frontier_v4">Frontier v4</option></select></label>
        <label>Modello<input id="model" type="text" placeholder="Ornith"></label>
        <div class="section-head"><h2>Harness</h2><div class="actions"><button data-harness-action="all">Tutti</button><button data-harness-action="none">Nessuno</button></div></div>
        <div id="harnesses" class="toggle-list"></div>
        <div class="two-col">
          <label>Repeat<input id="repeats" type="number" min="1" value="1"></label>
          <label>Seed<input id="seed" type="number" value="42"></label>
          <label>Timeout task<input id="timeout" type="number" min="1" value="900"></label>
          <label>Timeout totale<input id="totalTimeout" type="number" min="1" placeholder="nessuno"></label>
        </div>
        <button id="start" class="primary">Avvia benchmark</button>
        <p id="error" class="error" role="alert"></p>
      </aside>

      <section class="panel tasks-panel">
        <div class="section-head"><div><p class="eyebrow">CATALOGO</p><h2>Test</h2></div><div class="actions"><button data-task-action="all">Seleziona tutto</button><button data-task-action="none">Nessuno</button></div></div>
        <div id="taskSummary" class="muted"></div>
        <div id="tasks" class="task-groups"></div>
      </section>

      <section class="panel progress-panel">
        <div class="section-head"><h2>Run</h2><span id="counter" class="muted">0 / 0</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
        <div id="current" class="current">Nessuna run attiva.</div>
        <div id="events" class="events"></div>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
